<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>داشبورد درسی</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f5fb;--card:#fff;--tx:#1b1d2a;--mut:#6b7086;--bd:#e6e8f2;--ac:#5b5bf0;
--exam:#e5484d;--homework:#f5a623;--review:#3b82f6;--preview:#12b886;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1117;--card:#181b25;--tx:#eceefa;--mut:#9aa0b8;--bd:#272b3a;--ac:#8b8bff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1117;--card:#181b25;--tx:#eceefa;--mut:#9aa0b8;--bd:#272b3a;--ac:#8b8bff;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:Vazirmatn,Tahoma,"Segoe UI",sans-serif;line-height:1.7;font-size:15px}
header{padding:20px 16px 8px;display:flex;flex-wrap:wrap;gap:12px;align-items:end;justify-content:space-between}
h1{margin:0;font-size:24px;font-weight:800}
.sub{color:var(--mut);font-size:13px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:8px;overflow-x:auto;padding:8px 16px;border-bottom:1px solid var(--bd)}
nav a{white-space:nowrap;text-decoration:none;color:var(--tx);background:var(--card);border:1px solid var(--bd);padding:4px 14px;border-radius:99px;font-size:13px}
main{padding:16px;display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));width:100%}
section{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;min-width:0}
section.wide{grid-column:1/-1}
h2{margin:0 0 12px;font-size:17px;font-weight:800}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;padding:0 16px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px 14px}
.stat b{display:block;font-size:26px;font-weight:800;line-height:1.2}
.stat span{color:var(--mut);font-size:12px}
.item{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--bd)}
.item:first-of-type{border-top:0}
.dot{flex:none;width:6px;align-self:stretch;border-radius:4px;background:var(--k)}
.t{font-size:14px}
.meta{color:var(--mut);font-size:12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tag{background:color-mix(in srgb,var(--k) 16%,transparent);color:var(--k);border-radius:8px;padding:0 8px;font-size:11px;font-weight:600}
.sc{margin-inline-start:auto;font-weight:800;color:var(--mut);font-size:12px;flex:none}
.exam{border:1px solid var(--bd);border-radius:14px;padding:12px;display:flex;gap:12px;align-items:center;margin-bottom:10px}
.cd{flex:none;width:62px;height:62px;border-radius:14px;background:color-mix(in srgb,var(--exam) 14%,transparent);color:var(--exam);display:grid;place-items:center;text-align:center;font-weight:800;line-height:1.1;font-size:22px}
.cd small{display:block;font-size:10px;font-weight:600}
.days{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.day{border:1px solid var(--bd);border-radius:14px;padding:10px}
.day.today{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac)}
.day h3{margin:0 0 6px;font-size:13px}
.day .item{padding:6px 0}
.day .t{font-size:12.5px}
.tblw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:420px}
th,td{border:1px solid var(--bd);padding:6px 8px;text-align:center}
th{background:color-mix(in srgb,var(--ac) 10%,transparent)}
td.em,span.em{color:var(--mut)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--mut);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:4px;background:var(--k)}
svg text{fill:var(--tx);font-family:inherit}
.empty{color:var(--mut);font-size:13px}
.prow{display:grid;grid-template-columns:120px 1fr 130px;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--bd)}
.prow:first-of-type{border-top:0}
.pn{font-size:13px;font-weight:600}
.pbar{height:12px;border-radius:6px;background:var(--bd);overflow:hidden}
.pbar i{display:block;height:100%;border-radius:6px;background:var(--ac)}
.pv{font-size:12px;color:var(--mut);display:flex;gap:8px;align-items:center;justify-content:space-between}
.pv b{color:var(--tx)}
.late{background:color-mix(in srgb,var(--exam) 14%,transparent);color:var(--exam);border-radius:8px;padding:0 8px;font-size:11px;font-weight:600}
svg.chart{direction:ltr;display:block;max-width:560px;margin:0 auto}
@media(max-width:480px){.prow{grid-template-columns:1fr auto}.pbar{grid-column:1/-1;order:3}}
footer{padding:8px 16px 28px;color:var(--mut);font-size:12px;text-align:center}
@media(min-width:900px){body{font-size:16px}main{padding:20px 28px}header{padding:24px 28px 8px}nav{padding:8px 28px}.stats{padding:0 28px}}
</style>
</head>

[16,"2026-10-16","2026-10-18","شیمی",1,"homework","تمرین محاسبهٔ لگاریتم (۲ از ۲)",0,0,2,2,"todo"],
[15,"2026-10-16","2026-10-18","فیزیک",2,"homework","نوشتن فرمول‌ها، ۱۰ بار دوم (۲ از ۲)",0,0,2,2,"todo"],

[22,"2026-10-18","2026-10-19","ریاضی",1,"preview","پیش‌مطالعهٔ درس ۲، ترکیب توابع (۲ از ۲)",18,23,2,2,"todo"],
[23,"2026-10-18","2026-10-19","فارسی",3,"preview","پیش‌مطالعهٔ درس ۲: مست و هشیار",19,21,0,0,"todo"],
[24,"2026-10-18","2026-10-19","عربی",3,"preview","پیش‌مطالعهٔ درس ۲",17,24,0,0,"todo"],
[26,"2026-10-19","2026-10-20","زیست",1,"preview","پیش‌مطالعه: ادامهٔ درس از ص ۲۱",21,30,0,0,"todo"],

[28,"2026-10-20","2026-10-21","هویت اجتماعی",3,"preview","پیش‌مطالعهٔ درس ۲: پدیده‌های اجتماعی",8,16,0,0,"todo"]
],
exams:[
{s:"هویت اجتماعی",d:"2026-10-14",c:"درس ۱: کنش‌های ما",st:"upcoming"},
{s:"زیست",d:"2026-10-17",c:"فصل ۱: مولکول‌های اطلاعاتی (نوکلئیک اسیدها، همانندسازی دنا، پروتئین‌ها)",st:"upcoming"}
],
homework:[
{s:"شیمی",t:"یاد گرفتن نحوهٔ محاسبهٔ لگاریتم (قبل از جلسهٔ بعد)",d:"2026-10-18",st:"todo"},
{s:"فیزیک",t:"نوشتن فرمول‌های حرکت یکنواخت و شتابدار، ۲۰ بار",d:"2026-10-18",st:"todo"},
{s:"ریاضی",t:"حل صفحه ۱۴",d:null,st:"done"},
{s:"ریاضی",t:"تمرین صفحه ۱۰",d:"2026-10-11",st:"done"}
],
schedule:[
["شنبه",["مدیریت خانواده","زیست","دین و زندگی","ورزش"]],
["یکشنبه",["شیمی","فیزیک","فیزیک / خالی",""]],
["دوشنبه",["نگارش","ریاضی","فارسی","عربی"]],
["سه‌شنبه",["زیست","شیمی","سلامت و بهداشت",""]],
["چهارشنبه",["زبان","ریاضی","زبان","هویت اجتماعی"]]
],
books:[ /* subject, priority, lessons, taught, reviewed */
["ریاضی",1,15,1,1],["زبان انگلیسی",1,3,0,0],["فیزیک",2,21,2,0],["عربی",3,4,1,0],["فارسی",3,54,2,0],
["هویت اجتماعی",3,10,1,1],["دین و زندگی",3,10,1,0],["سلامت و بهداشت",3,14,0,0],["مدیریت خانواده",4,22,1,0],["نگارش",4,12,0,0]
],
pace:[ /* subject, [date,page] ... cumulative page the teacher reached */
["زیست",[["2026-10-11",16],["2026-10-13",20]],"#12b886"],
["شیمی",[["2026-10-11",22],["2026-10-13",25]],"#3b82f6"],
["فیزیک",[["2026-10-13",17]],"#f5a623"],
["زبان انگلیسی",[["2026-10-07",25]],"#e5484d"]
]};
let DATA=SNAP;
const KIND={exam:["امتحان","var(--exam)"],homework:["تکلیف","var(--homework)"],review:["مرور","var(--review)"],preview:["پیش‌مطالعه","var(--preview)"]};

/* ===== helpers ===== */
const fa=n=>Number(n).toLocaleString('fa-IR',{useGrouping:false});
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
let TODAY=iso(new Date());
const dt=s=>new Date(s+'T12:00:00');
const addDays=(s,n)=>{const d=dt(s);d.setDate(d.getDate()+n);return iso(d)};
const jd=(s,o)=>new Intl.DateTimeFormat('fa-IR-u-ca-persian',o||{weekday:'long',day:'numeric',month:'long'}).format(dt(s));
const diff=s=>Math.round((dt(s)-dt(TODAY))/864e5);
/* قانون مهلت: هر کاری که «تاریخ ارائه» دارد (امتحان، تحویل تکلیف، ...) آخرین روز کار روی آن «یک روز قبل» است. */
const dl=s=>addDays(s,-1);
const NORM=d=>String(d).length<=5?TODAY.slice(0,4)+'-'+d:d;
const score=r=>{const w={exam:8,homework:5,review:3,preview:2}[r.k];const left=Math.max(0,diff(dl(r.due)));return Math.round(w*(5-r.pr)*(4/(left+1))*10)/10};
let P;const mkP=()=>{TODAY=iso(new Date());P=DATA.plan.map(r=>{const o={id:r[0],pd:r[1],due:r[2],s:r[3],pr:r[4],k:r[5],t:r[6],pf:r[7],pt:r[8],st:r[11]};o.sc=score(o);return o})};
/* فقط کارهای انجام‌نشده؛ فقط ۷ روز پیش‌رو (امروز تا ۶ روز بعد)؛ کارهای عقب‌ماندهٔ روزهای قبل فقط اگر مهلتشان هنوز نگذشته باشد */
const winEnd=()=>addDays(TODAY,6);
const inWindow=r=>r.st==='todo'&&r.pd>=TODAY&&r.pd<=winEnd();
const carry=r=>r.st==='todo'&&r.pd<TODAY&&dl(r.due)>=TODAY;
const openHw=()=>DATA.homework.filter(h=>h.st==='todo'&&(!h.d||diff(dl(h.d))>=0));
const pages=r=>r.pf?`ص ${fa(r.pf)}–${fa(r.pt)}`:'';
const row=(r,showDue)=>`<div class="item" style="--k:${KIND[r.k][1]}"><div class="dot"></div><div><div class="t">${r.s}: ${r.t}</div><div class="meta"><span class="tag">${KIND[r.k][0]}</span>${r.pd<TODAY?'<span class="late">عقب‌مانده</span>':''}<span>${pages(r)}</span>${showDue?`<span>مهلت ${diff(dl(r.due))===0?'امروز':jd(dl(r.due),{weekday:'long',day:'numeric',month:'long'})}</span>`:''}</div></div><div class="sc">${fa(r.sc)}</div></div>`;
const sortR=a=>a.slice().sort((x,y)=>y.sc-x.sc);
const GRID='var(--bd)',AXIS='var(--mut)';

/* ===== modules: add an object here to add a section ===== */
const MODULES=[
{id:"today",title:"برنامهٔ امروز",render(){
 let d=TODAY,rows=P.filter(r=>(r.pd===TODAY&&r.st==='todo')||carry(r));
 if(!rows.length){
  const nx=P.filter(inWindow).map(r=>r.pd).sort()[0];
  const hadToday=P.some(r=>r.pd===TODAY);
  if(nx){d=nx;rows=P.filter(r=>r.st==='todo'&&r.pd===nx)}
  const msg=hadToday?'کارهای امروز تمام شده؛ ':'برای امروز چیزی ثبت نشده؛ ';
  return (nx?`<div class="empty">${msg}نزدیک‌ترین روز: ${jd(d)}</div>`:`<div class="empty">${msg}</div>`)+sortR(rows).map(r=>row(r,true)).join('')}
 return sortR(rows).map(r=>row(r,true)).join('')}},
{id:"exams",title:"امتحان‌ها",render(){
 /* امتحانِ امروز یا گذشته دیگر نشان داده نمی‌شود: وقتی از مدرسه برمی‌گردی امتحان داده‌ای. */
 return DATA.exams.filter(e=>e.st==='upcoming'&&diff(e.d)>=1).sort((a,b)=>a.d<b.d?-1:1).map(e=>{const n=diff(e.d);
 const last=n===1?'امروز آخرین روز مطالعه است':'آخرین روز مطالعه: '+jd(dl(e.d),{weekday:'long',day:'numeric',month:'long'});
 return `<div class="exam"><div class="cd">${n===1?'فردا':fa(n)+'<small>روز مانده</small>'}</div><div><b>${e.s}</b><div class="meta">امتحان: ${jd(e.d)} · ${last}</div><div class="t">${e.c}</div></div></div>`}).join('')||'<div class="empty">امتحان پیش‌رویی ثبت نشده.</div>'}},
{id:"hw",title:"تکالیف",render(){
 const H=openHw().sort((a,b)=>(a.d||'9999')<(b.d||'9999')?-1:1);
 return H.map(h=>{const k=h.d?diff(dl(h.d)):null;
 return `<div class="item" style="--k:var(--homework)"><div class="dot"></div><div><div class="t">${h.s}: ${h.t}</div><div class="meta">${h.d?'مهلت '+(k===0?'امروز':jd(dl(h.d),{weekday:'long',day:'numeric',month:'long'}))+(k>0?` · ${fa(k)} روز مانده`:''):'بدون مهلت'}</div></div></div>`}).join('')||'<div class="empty">تکلیف بازی نداری.</div>'}},
{id:"week",title:"برنامهٔ ۷ روز آینده (اولویت‌بندی‌شده)",wide:1,render(){
 const days=Array.from({length:7},(_,i)=>addDays(TODAY,i));
 return `<div class="days">${days.map(d=>{const rs=sortR(P.filter(r=>r.st==='todo'&&r.pd===d));return `<div class="day ${d===TODAY?'today':''}"><h3>${jd(d)}</h3>${rs.length?rs.map(r=>row(r,false)).join(''):'<div class="empty">برنامه‌ای نیست</div>'}</div>`}).join('')}</div><div class="legend">${Object.values(KIND).map(k=>`<span style="--k:${k[1]}"><i></i>${k[0]}</span>`).join('')}<span>عدد کنار هر کار = امتیاز اولویت</span></div>`}},
{id:"load",title:"حجم کار ۷ روز آینده",render(){
 const days=Array.from({length:7},(_,i)=>addDays(TODAY,i)),kinds=['exam','homework','review','preview'];
 const cnt=d=>kinds.map(k=>P.filter(r=>r.st==='todo'&&r.pd===d&&r.k===k).length);
 const tot=days.map(d=>cnt(d).reduce((a,b)=>a+b,0));
 const W=420,H=256,L=34,R=10,T=40,Bm=52,pw=W-L-R,ph=H-T-Bm,bw=pw/7;
 const rawMax=Math.max(1,...tot),step=rawMax<=6?1:Math.ceil(rawMax/6),mx=Math.ceil(rawMax/step)*step,Y=v=>T+ph-v/mx*ph;
 let g=`<text x="2" y="14" font-size="11" text-anchor="start" style="fill:var(--mut)">تعداد کار</text>`;
 for(let v=0;v<=mx;v+=step){const y=Y(v);g+=`<line x1="${L}" y1="${y}" x2="${W-R}" y2="${y}" stroke="${GRID}" stroke-width="1"/><text x="${L-6}" y="${y+4}" font-size="10" text-anchor="end" style="fill:var(--mut)">${fa(v)}</text>`}
 days.forEach((d,i)=>{const c=cnt(d),x=L+i*bw+bw*.2;let acc=0;
  g+=`<line x1="${L+i*bw}" y1="${T}" x2="${L+i*bw}" y2="${T+ph}" stroke="${GRID}" stroke-width="1" stroke-dasharray="2 3"/>`;
  kinds.forEach((k,j)=>{if(!c[j])return;const y1=Y(acc+c[j]),y0=Y(acc);g+=`<rect x="${x}" y="${y1}" width="${bw*.6}" height="${Math.max(1,y0-y1-1.5)}" rx="3" style="fill:${KIND[k][1]}"/>`;acc+=c[j]});
  if(tot[i])g+=`<text x="${x+bw*.3}" y="${Y(tot[i])-5}" font-size="11" font-weight="700" text-anchor="middle">${fa(tot[i])}</text>`;
  const cx=L+i*bw+bw/2,td=d===TODAY;
  g+=`<text x="${cx}" y="${T+ph+16}" font-size="10" text-anchor="middle" ${td?'font-weight="800" style="fill:var(--ac)"':'style="fill:var(--mut)"'}>${td?'امروز':jd(d,{weekday:'long'})}</text><text x="${cx}" y="${T+ph+30}" font-size="10" text-anchor="middle" style="fill:var(--mut)">${jd(d,{day:'numeric',month:'short'})}</text>`});
 g+=`<line x1="${L}" y1="${T}" x2="${L}" y2="${T+ph}" stroke="${AXIS}" stroke-width="1.5"/><line x1="${L}" y1="${T+ph}" x2="${W-R}" y2="${T+ph}" stroke="${AXIS}" stroke-width="1.5"/>`;
 return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="تعداد کارهای انجام‌نشده در هر یک از هفت روز آینده">${g}</svg><div class="legend">${Object.values(KIND).map(k=>`<span style="--k:${k[1]}"><i></i>${k[0]}</span>`).join('')}</div>`}},
{id:"prog",title:"پیشرفت تدریس هر درس",render(){
 const B=DATA.books.filter(b=>b[2]>0);
 const rows=B.map(b=>{const pct=Math.round(Math.max(0,Math.min(1,b[3]/b[2]))*100);
  return `<div class="prow"><div class="pn">${b[0]}</div><div class="pbar" role="img" aria-label="${b[0]}: ${fa(b[3])} از ${fa(b[2])} درس"><i style="width:${pct}%"></i></div><div class="pv">${b[3]?`<span>${fa(b[3])} از ${fa(b[2])} درس</span><b>${fa(pct)}٪</b>`:`<span>هنوز شروع نشده (${fa(b[2])} درس)</span>`}</div></div>`}).join('');
 return `<div class="sub" style="margin-bottom:8px">هر نوار نشان می‌دهد از کل درس‌های آن کتاب چند درس تدریس شده است.</div>${rows||'<div class="empty">اطلاعاتی نیست.</div>'}`}},
{id:"pace",title:"روند پیشروی تدریس معلم‌ها",render(){
 const S=DATA.pace.map(p=>({n:p[0],c:p[2],pts:p[1].map(a=>({d:NORM(a[0]),v:a[1]})).sort((a,b)=>a.d<b.d?-1:1)})).filter(s=>s.pts.length);
 if(!S.length)return '<div class="empty">گزارشی ثبت نشده.</div>';
 const W=440,H=280,L=44,R=14,T=44,Bm=56,pw=W-L-R,ph=H-T-Bm;
 const allD=[...new Set(S.flatMap(s=>s.pts.map(p=>p.d)))].sort();
 const off=d=>Math.round((dt(d)-dt(allD[0]))/864e5),span=Math.max(1,off(allD[allD.length-1]));
 const X=d=>allD.length===1?L+pw/2:L+16+off(d)/span*(pw-32);
 const rawMax=Math.max(5,...S.flatMap(s=>s.pts.map(p=>p.v)));let step=5;while(rawMax/step>6)step*=2;const mx=Math.ceil(rawMax/step)*step,Y=v=>T+ph-v/mx*ph;
 let g=`<text x="2" y="12" font-size="11" text-anchor="start" style="fill:var(--mut)">شمارهٔ صفحه</text>`;
 for(let v=0;v<=mx;v+=step){const y=Y(v);g+=`<line x1="${L}" y1="${y}" x2="${W-R}" y2="${y}" stroke="${GRID}" stroke-width="1"/><text x="${L-6}" y="${y+4}" font-size="10" text-anchor="end" style="fill:var(--mut)">${fa(v)}</text>`}
 const every=allD.length>7?2:1;
 allD.forEach((d,i)=>{const x=X(d);g+=`<line x1="${x}" y1="${T}" x2="${x}" y2="${T+ph}" stroke="${GRID}" stroke-width="1" stroke-dasharray="2 3"/><line x1="${x}" y1="${T+ph}" x2="${x}" y2="${T+ph+4}" stroke="${AXIS}" stroke-width="1.5"/>`+(i%every===0?`<text x="${x}" y="${T+ph+18}" font-size="10" text-anchor="middle" style="fill:var(--mut)">${jd(d,{day:'numeric',month:'short'})}</text>`:'')});
 g+=`<line x1="${L}" y1="${T}" x2="${L}" y2="${T+ph}" stroke="${AXIS}" stroke-width="1.5"/><line x1="${L}" y1="${T+ph}" x2="${W-R}" y2="${T+ph}" stroke="${AXIS}" stroke-width="1.5"/><text x="${L+pw/2}" y="${H-6}" font-size="11" text-anchor="middle" style="fill:var(--mut)">تاریخ گزارش</text>`;
 S.forEach(s=>{const q=s.pts.map(p=>[X(p.d),Y(p.v),p.v]);
  if(q.length>1)g+=`<polyline fill="none" stroke="${s.c}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" points="${q.map(a=>a[0]+','+a[1]).join(' ')}"/>`;
  g+=q.map(a=>`<circle cx="${a[0]}" cy="${a[1]}" r="4.5" fill="${s.c}" stroke="var(--card)" stroke-width="1.5"/><text x="${a[0]}" y="${a[1]-9}" font-size="10" font-weight="700" text-anchor="middle" style="fill:${s.c}">${fa(a[2])}</text>`).join('')});
 return `<div class="sub" style="margin-bottom:4px">هر نقطه یک گزارش است: معلم در آن تاریخ تا کدام صفحه رسیده بود.</div><svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="نمودار صفحهٔ تدریس‌شده بر حسب تاریخ">${g}</svg><div class="legend">${S.map(s=>`<span style="--k:${s.c}"><i></i>${s.n}${s.pts.length===1?' (فقط یک گزارش)':''}</span>`).join('')}</div>`}},
{id:"sched",title:"برنامهٔ کلاسی هفته",wide:1,render(){
 const fix=c=>String(c||'').replace(/—|–|-{2,}/g,'خالی').trim();
 return `<div class="tblw"><table><tr><th></th><th>زنگ ۱</th><th>زنگ ۲</th><th>زنگ ۳</th><th>زنگ ۴</th></tr>${DATA.schedule.map(r=>`<tr><th>${r[0]}</th>${r[1].map(c=>{const t=fix(c)||'خالی';return `<td class="${t==='خالی'?'em':''}">${t.split(' / ').map(x=>x==='خالی'?'<span class="em">خالی</span>':x).join(' / ')}</td>`}).join('')}</tr>`).join('')}</table></div>`}}
];

/* ===== render ===== */
const foot=m=>{document.getElementById('foot').textContent=m};
function start(){mkP();const main=document.getElementById('main'),nav=document.getElementById('nav');main.replaceChildren();nav.replaceChildren();
MODULES.forEach(m=>{const s=document.createElement('section');s.id=m.id;if(m.wide)s.className='wide';s.innerHTML=`<h2>${m.title}</h2>${m.render()}`;main.appendChild(s);
 nav.insertAdjacentHTML('beforeend',`<a href="#${m.id}">${m.title.split(' (')[0]}</a>`)});
document.getElementById('today').textContent=jd(TODAY,{weekday:'long',day:'numeric',month:'long',year:'numeric'});
document.getElementById('stamp').textContent='آخرین به‌روزرسانی داده: '+jd(STAMP,{day:'numeric',month:'long'});
const vis=P.filter(r=>inWindow(r)||carry(r)),nx=DATA.exams.filter(e=>e.st==='upcoming'&&diff(e.d)>=1).sort((a,b)=>a.d<b.d?-1:1)[0];
const tdy=P.filter(r=>r.pd===TODAY),tdn=tdy.filter(r=>r.st==='done').length;
document.getElementById('stats').innerHTML=[[nx?(diff(nx.d)===1?'فردا':fa(diff(nx.d))+' روز'):'—',nx?'تا امتحان '+nx.s:'امتحانی نیست'],[fa(openHw().length),'تکلیف باز'],[fa(vis.length),'کار باقی‌مانده (۷ روز آینده)'],[tdy.length?fa(tdn)+'/'+fa(tdy.length):'—','انجام‌شده‌های امروز']].map(a=>`<div class="stat"><b>${a[0]}</b><span>${a[1]}</span></div>`).join('');
}
async function refreshData({initial=false}={}) {
  const st=document.getElementById('stamp');
  try {
    const r=await fetch(API_URL,{cache:'no-store',headers:{'Accept':'application/json'}});
    if(!r.ok) throw new Error(`API ${r.status}`);
    const next=await r.json();
    if(!next || !Array.isArray(next.plan) || !Array.isArray(next.exams) || !Array.isArray(next.homework)) throw new Error('پاسخ API ساختار مورد انتظار را ندارد');
    DATA=next; STAMP=iso(new Date()); lastLiveDataAt=new Date(); start();
    st.textContent='اتصال زنده به دیتابیس · آخرین دریافت: '+lastLiveDataAt.toLocaleTimeString('fa-IR');
    st.title='به‌روزرسانی خودکار هر ۳۰ ثانیه';
    foot('داده‌ها به‌صورت زنده از دیتابیس خوانده می‌شوند. · نسخهٔ ۲');
  } catch(e) {
    if(initial) start();
    st.textContent='اتصال دیتابیس برقرار نیست؛ '+(lastLiveDataAt?'آخرین داده زنده: '+lastLiveDataAt.toLocaleTimeString('fa-IR'):'نمایش داده‌های ذخیره‌شده');
    st.title='خطا در دریافت داده: '+String(e.message||e);
    foot('اتصال به دیتابیس برقرار نیست؛ آنچه می‌بینی ممکن است قدیمی باشد. صفحه خودش دوباره تلاش می‌کند. · نسخهٔ ۲');
  }
}
refreshData({initial:true});
setInterval(()=>refreshData(),REFRESH_MS);
</script>
