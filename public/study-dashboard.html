<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>داشبورد درسی</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f5fb;--card:#fff;--tx:#1b1d2a;--mut:#6b7086;--bd:#e6e8f2;--ac:#5b5bf0;
--exam:#e5484d;--homework:#f5a623;--review:#3b82f6;--preview:#12b886;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1117;--card:#181b25;--tx:#eceefa;--mut:#9aa0b8;--bd:#272b3a;--ac:#8b8bff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1117;--card:#181b25;--tx:#eceefa;--mut:#9aa0b8;--bd:#272b3a;--ac:#8b8bff;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:Vazirmatn,Tahoma,"Segoe UI",sans-serif;line-height:1.7;font-size:15px}
header{padding:20px 16px 8px;display:flex;flex-wrap:wrap;gap:12px;align-items:end;justify-content:space-between}
h1{margin:0;font-size:24px;font-weight:800}
.sub{color:var(--mut);font-size:13px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:8px;overflow-x:auto;padding:8px 16px;border-bottom:1px solid var(--bd)}
nav a{white-space:nowrap;text-decoration:none;color:var(--tx);background:var(--card);border:1px solid var(--bd);padding:4px 14px;border-radius:99px;font-size:13px}
main{padding:16px;display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));width:100%}
section{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;min-width:0}
section.wide{grid-column:1/-1}
h2{margin:0 0 12px;font-size:17px;font-weight:800}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;padding:0 16px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px 14px}
.stat b{display:block;font-size:26px;font-weight:800;line-height:1.2}
.stat span{color:var(--mut);font-size:12px}
.item{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--bd)}
.item:first-of-type{border-top:0}
.dot{flex:none;width:6px;align-self:stretch;border-radius:4px;background:var(--k)}
.item.done{opacity:.5}
.item.done .t{text-decoration:line-through}
.t{font-size:14px}
.meta{color:var(--mut);font-size:12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tag{background:color-mix(in srgb,var(--k) 16%,transparent);color:var(--k);border-radius:8px;padding:0 8px;font-size:11px;font-weight:600}
.sc{margin-inline-start:auto;font-weight:800;color:var(--mut);font-size:12px;flex:none}
.exam{border:1px solid var(--bd);border-radius:14px;padding:12px;display:flex;gap:12px;align-items:center;margin-bottom:10px}
.cd{flex:none;width:62px;height:62px;border-radius:14px;background:color-mix(in srgb,var(--exam) 14%,transparent);color:var(--exam);display:grid;place-items:center;text-align:center;font-weight:800;line-height:1.1;font-size:22px}
.cd small{display:block;font-size:10px;font-weight:600}
.days{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.day{border:1px solid var(--bd);border-radius:14px;padding:10px}
.day.today{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac)}
.day h3{margin:0 0 6px;font-size:13px}
.day .item{padding:6px 0}
.day .t{font-size:12.5px}
.tblw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:420px}
th,td{border:1px solid var(--bd);padding:6px 8px;text-align:center}
th{background:color-mix(in srgb,var(--ac) 10%,transparent)}
td.em{color:var(--mut)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--mut);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:4px;background:var(--k)}
svg text{fill:var(--tx);font-family:inherit}
.empty{color:var(--mut);font-size:13px}
footer{padding:8px 16px 28px;color:var(--mut);font-size:12px;text-align:center}
@media(min-width:900px){body{font-size:16px}main{padding:20px 28px}header{padding:24px 28px 8px}nav{padding:8px 28px}.stats{padding:0 28px}}
</style>
</head>
<body>
<header><div><h1>داشبورد درسی</h1><div class="sub" id="today"></div></div><div class="sub" id="stamp"></div></header>
<div class="stats" id="stats"></div>
<nav id="nav"></nav>
<main id="main"></main>
<footer>فقط نمایشی؛ برای ثبت انجام‌شدن کارها به دکتر سمی بگو.</footer>

<script>
/* ===== DATA: snapshot of D1 tables (replace/add keys to extend) ===== */
let STAMP="2026-10-13";
/* آدرس ورکر را اینجا بگذار؛ مثال: "https://lesson-dashboard.YOURNAME.workers.dev/api/data" . اگر خالی باشد، نسخهٔ ذخیره‌شدهٔ SNAP نمایش داده می‌شود */
const API_URL = window.STUDY_API_URL || "/api/data";
const REFRESH_MS = 30000;
let lastLiveDataAt = null;
const SNAP={
plan:[
[1,"2026-10-13","2026-10-14","هویت اجتماعی",3,"exam","مرور نهایی درس ۱ هویت اجتماعی",2,7,0,0,"done"],
[2,"2026-10-13","2026-10-17","زیست",1,"exam","مرور فصل ۱ برای امتحان (۱ از ۴)",1,10,1,4,"done"],
[3,"2026-10-13","2026-10-14","زبان انگلیسی",1,"preview","پیش‌مطالعهٔ درس ۱ (نیمهٔ اول)",15,28,1,2,"done"],
[4,"2026-10-13","2026-10-14","ریاضی",1,"preview","پیش‌مطالعهٔ درس ۲، ترکیب توابع (۱ از ۲)",11,17,1,2,"todo"],
[5,"2026-10-13","2026-10-15","شیمی",1,"review","مرور درس امروز",22,25,0,0,"todo"],
[6,"2026-10-14","2026-10-17","زیست",1,"exam","مرور فصل ۱ برای امتحان (۲ از ۴)",11,20,2,4,"todo"],
[7,"2026-10-14","2026-10-16","فیزیک",2,"review","مرور درس ۱: شناخت حرکت (۱ از ۲)",2,12,1,2,"todo"],
[8,"2026-10-14","2026-10-18","عربی",3,"review","مرور درس ۱",1,16,0,0,"todo"],
[9,"2026-10-15","2026-10-17","زیست",1,"exam","حل تست و مرور دوم کل فصل (۳ از ۴)",1,20,3,4,"todo"],
[13,"2026-10-15","2026-10-18","شیمی",1,"homework","یادگیری قواعد لگاریتم (۱ از ۲)",0,0,1,2,"todo"],
[10,"2026-10-15","2026-10-16","شیمی",1,"review","مرور صفحه‌های قبلی که مرور نشده",1,22,0,0,"todo"],
[12,"2026-10-15","2026-10-18","فیزیک",2,"homework","نوشتن فرمول‌های حرکت، ۱۰ بار (۱ از ۲)",0,0,1,2,"todo"],
[11,"2026-10-15","2026-10-16","فیزیک",2,"review","مرور درس ۲ و ادامهٔ درس ۳ (۲ از ۲)",13,17,2,2,"todo"],
[14,"2026-10-16","2026-10-17","زیست",1,"exam","مرور نهایی و خودآزمایی کل فصل (۴ از ۴)",1,20,4,4,"todo"],
[16,"2026-10-16","2026-10-18","شیمی",1,"homework","تمرین محاسبهٔ لگاریتم (۲ از ۲)",0,0,2,2,"todo"],
[15,"2026-10-16","2026-10-18","فیزیک",2,"homework","نوشتن فرمول‌ها، ۱۰ بار دوم (۲ از ۲)",0,0,2,2,"todo"],
[18,"2026-10-16","2026-10-18","شیمی",1,"preview","پیش‌مطالعه: ادامهٔ فصل ۱",26,31,0,0,"todo"],
[17,"2026-10-16","2026-10-18","فیزیک",2,"preview","پیش‌مطالعه: ادامهٔ درس ۳",17,21,0,0,"todo"],
[20,"2026-10-17","2026-10-19","فارسی",3,"review","مرور ستایش و درس ۱",10,18,0,0,"todo"],
[21,"2026-10-17","2026-10-19","دین و زندگی",3,"review","مرور درس ۱",0,0,0,0,"todo"],
[19,"2026-10-17","2026-10-20","مدیریت خانواده",4,"review","مرور درس ۱ (تنها مرور لازم)",0,0,0,0,"todo"],
[22,"2026-10-18","2026-10-19","ریاضی",1,"preview","پیش‌مطالعهٔ درس ۲، ترکیب توابع (۲ از ۲)",18,23,2,2,"todo"],
[23,"2026-10-18","2026-10-19","فارسی",3,"preview","پیش‌مطالعهٔ درس ۲: مست و هشیار",19,21,0,0,"todo"],
[24,"2026-10-18","2026-10-19","عربی",3,"preview","پیش‌مطالعهٔ درس ۲",17,24,0,0,"todo"],
[26,"2026-10-19","2026-10-20","زیست",1,"preview","پیش‌مطالعه: ادامهٔ درس از ص ۲۱",21,30,0,0,"todo"],
[25,"2026-10-19","2026-10-20","سلامت و بهداشت",3,"preview","پیش‌مطالعهٔ درس ۱",0,0,0,0,"todo"],
[27,"2026-10-20","2026-10-21","زبان انگلیسی",1,"preview","پیش‌مطالعهٔ درس ۱ (از ص ۲۶ تا آخر)",26,41,2,2,"todo"],
[28,"2026-10-20","2026-10-21","هویت اجتماعی",3,"preview","پیش‌مطالعهٔ درس ۲: پدیده‌های اجتماعی",8,16,0,0,"todo"]
],
exams:[
{s:"هویت اجتماعی",d:"2026-10-14",c:"درس ۱: کنش‌های ما",st:"upcoming"},
{s:"زیست",d:"2026-10-17",c:"فصل ۱: مولکول‌های اطلاعاتی (نوکلئیک اسیدها، همانندسازی دنا، پروتئین‌ها)",st:"upcoming"}
],
homework:[
{s:"شیمی",t:"یاد گرفتن نحوهٔ محاسبهٔ لگاریتم (قبل از جلسهٔ بعد)",d:"2026-10-18",st:"todo"},
{s:"فیزیک",t:"نوشتن فرمول‌های حرکت یکنواخت و شتابدار، ۲۰ بار",d:"2026-10-18",st:"todo"},
{s:"ریاضی",t:"حل صفحه ۱۴",d:null,st:"done"},
{s:"ریاضی",t:"تمرین صفحه ۱۰",d:"2026-10-11",st:"done"}
],
schedule:[
["شنبه",["مدیریت خانواده","زیست","دین و زندگی","ورزش"]],
["یکشنبه",["شیمی","فیزیک","فیزیک / —",""]],
["دوشنبه",["نگارش","ریاضی","فارسی","عربی"]],
["سه‌شنبه",["زیست","شیمی","سلامت و بهداشت",""]],
["چهارشنبه",["زبان","ریاضی","زبان","هویت اجتماعی"]]
],
books:[ /* subject, priority, lessons, taught, reviewed */
["ریاضی",1,15,1,1],["زبان انگلیسی",1,3,0,0],["فیزیک",2,21,2,0],["عربی",3,4,1,0],["فارسی",3,54,2,0],
["هویت اجتماعی",3,10,1,1],["دین و زندگی",3,10,1,0],["سلامت و بهداشت",3,14,0,0],["مدیریت خانواده",4,22,1,0],["نگارش",4,12,0,0]
],
pace:[ /* subject, [date,page] ... cumulative page the teacher reached */
["زیست",[["10-11",16],["10-13",20]],"#12b886"],
["شیمی",[["10-11",22],["10-13",25]],"#3b82f6"],
["فیزیک",[["10-13",17]],"#f5a623"],
["زبان انگلیسی",[["10-07",25]],"#e5484d"]
]};
let DATA=SNAP;
const KIND={exam:["امتحان","var(--exam)"],homework:["تکلیف","var(--homework)"],review:["مرور","var(--review)"],preview:["پیش‌مطالعه","var(--preview)"]};

/* ===== helpers ===== */
const fa=n=>Number(n).toLocaleString('fa-IR',{useGrouping:false});
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const TODAY=iso(new Date());
const dt=s=>new Date(s+'T12:00:00');
const jd=(s,o)=>new Intl.DateTimeFormat('fa-IR-u-ca-persian',o||{weekday:'long',day:'numeric',month:'long'}).format(dt(s));
const diff=s=>Math.round((dt(s)-dt(TODAY))/864e5);
const score=r=>{const[,,due,,pr,k]=r;const w={exam:8,homework:5,review:3,preview:2}[k];return Math.round(w*(5-pr)*(4/(Math.max(0,diff(due))+1))*10)/10};
let P;const mkP=()=>{P=DATA.plan.map(r=>({id:r[0],pd:r[1],due:r[2],s:r[3],pr:r[4],k:r[5],t:r[6],pf:r[7],pt:r[8],st:r[11],sc:score(r)}))};
const pages=r=>r.pf?` · ص ${fa(r.pf)}–${fa(r.pt)}`:'';
const row=(r,showDue)=>`<div class="item ${r.st}" style="--k:${KIND[r.k][1]}"><div class="dot"></div><div><div class="t">${r.s}: ${r.t}</div><div class="meta"><span class="tag">${KIND[r.k][0]}</span><span>${pages(r).slice(3)||''}</span>${showDue?`<span>مهلت ${jd(r.due,{day:'numeric',month:'long'})}</span>`:''}</div></div><div class="sc">${r.st==='done'?'انجام شد':fa(r.sc)}</div></div>`;
const sortR=a=>a.slice().sort((x,y)=>(x.st==='done')-(y.st==='done')||y.sc-x.sc);

/* ===== modules: add an object here to add a section ===== */
const MODULES=[
{id:"today",title:"برنامهٔ امروز",render(){
 let d=TODAY,rows=P.filter(r=>r.pd===d||(r.pd<TODAY&&r.st==='todo'));
 if(!rows.length){const nx=P.map(r=>r.pd).filter(x=>x>TODAY).sort()[0];if(nx){d=nx;rows=P.filter(r=>r.pd===d)}}
 const head=d===TODAY?'':`<div class="empty">برای امروز چیزی ثبت نشده؛ نزدیک‌ترین روز: ${jd(d)}</div>`;
 return head+(rows.length?sortR(rows).map(r=>row(r,true)).join(''):'<div class="empty">برنامه‌ای ثبت نشده است.</div>')}},
{id:"exams",title:"امتحان‌ها",render(){
 return DATA.exams.filter(e=>e.st==='upcoming').sort((a,b)=>a.d<b.d?-1:1).map(e=>{const n=diff(e.d);
 return `<div class="exam"><div class="cd">${n<=0?(n===0?'امروز':'گذشته'):fa(n)}${n>0?'<small>روز مانده</small>':''}</div><div><b>${e.s}</b><div class="meta">${jd(e.d)}</div><div class="t">${e.c}</div></div></div>`}).join('')||'<div class="empty">امتحانی ثبت نشده.</div>'}},
{id:"hw",title:"تکالیف",render(){
 return DATA.homework.slice().sort((a,b)=>(a.st==='done')-(b.st==='done')||(a.d||'9')<(b.d||'9')?-1:1).map(h=>`<div class="item ${h.st}" style="--k:var(--homework)"><div class="dot"></div><div><div class="t">${h.s}: ${h.t}</div><div class="meta">${h.d?'مهلت '+jd(h.d,{day:'numeric',month:'long'}):'بدون مهلت'}${h.st==='todo'&&h.d?` · ${diff(h.d)<=0?'امروز':fa(diff(h.d))+' روز مانده'}`:''}</div></div><div class="sc">${h.st==='done'?'انجام شد':''}</div></div>`).join('')}},
{id:"week",title:"برنامهٔ هفتگی (اولویت‌بندی‌شده)",wide:1,render(){
 const days=[...new Set(P.map(r=>r.pd))].sort();
 return `<div class="days">${days.map(d=>`<div class="day ${d===TODAY?'today':''}"><h3>${jd(d)}</h3>${sortR(P.filter(r=>r.pd===d)).map(r=>row(r,false)).join('')}</div>`).join('')}</div><div class="legend">${Object.values(KIND).map(k=>`<span style="--k:${k[1]}"><i></i>${k[0]}</span>`).join('')}<span>عدد کنار هر کار = امتیاز اولویت</span></div>`}},
{id:"load",title:"حجم کار روزانه",render(){
 const days=[...new Set(P.map(r=>r.pd))].sort(),W=360,H=190,bw=W/days.length;
 const mx=Math.max(...days.map(d=>P.filter(r=>r.pd===d).length));
 let g='';days.forEach((d,i)=>{let y=H-26;['exam','homework','review','preview'].forEach(k=>{const n=P.filter(r=>r.pd===d&&r.k===k).length;if(!n)return;const h=n/mx*(H-50);y-=h;g+=`<rect x="${i*bw+bw*.18}" y="${y}" width="${bw*.64}" height="${h-1.5}" rx="4" style="fill:${KIND[k][1]}"/>`});
 g+=`<text x="${i*bw+bw/2}" y="${H-8}" font-size="11" text-anchor="middle">${fa(Number(d.slice(8)))}</text>`});
 return `<svg viewBox="0 0 ${W} ${H}" width="100%">${g}</svg><div class="legend">${Object.values(KIND).map(k=>`<span style="--k:${k[1]}"><i></i>${k[0]}</span>`).join('')}</div>`}},
{id:"prog",title:"پیشرفت تدریس هر درس",render(){
 const B=DATA.books.filter(b=>b[2]>0);let g='';const rh=26,W=360;
 B.forEach((b,i)=>{const y=i*rh,p=b[3]/b[2];g+=`<text x="${W-4}" y="${y+16}" font-size="11" text-anchor="end">${b[0]}</text><rect x="4" y="${y+6}" width="${W-130}" height="10" rx="5" style="fill:var(--bd)"/><rect x="${4+(W-130)*(1-p)}" y="${y+6}" width="${(W-130)*p}" height="10" rx="5" style="fill:var(--ac)"/><text x="${W-122}" y="${y+16}" font-size="10" text-anchor="start" style="fill:var(--mut)">${fa(b[3])}/${fa(b[2])}</text>`});
 return `<svg viewBox="0 0 ${W} ${B.length*rh}" width="100%">${g}</svg><div class="legend">درس‌های تدریس‌شده از کل درس‌ها</div>`}},
{id:"pace",title:"سرعت تدریس معلم‌ها (صفحهٔ رسیده)",render(){
 const W=360,H=190,all=DATA.pace.flatMap(p=>p[1]),mx=Math.max(...all.map(a=>a[1]))+5;
 const ds=[...new Set(all.map(a=>a[0]))].sort(),X=d=>30+(ds.indexOf(d))*((W-50)/Math.max(1,ds.length-1)),Y=v=>H-26-(v/mx)*(H-46);
 let g=ds.map(d=>`<text x="${X(d)}" y="${H-8}" font-size="10" text-anchor="middle">${fa(d.replace('-','/'))}</text>`).join('');
 DATA.pace.forEach(p=>{const pts=p[1].map(a=>[X(a[0]),Y(a[1])]);g+=`<polyline fill="none" stroke="${p[2]}" stroke-width="2.5" points="${pts.map(q=>q.join(',')).join(' ')}"/>`+pts.map((q,i)=>`<circle cx="${q[0]}" cy="${q[1]}" r="4" fill="${p[2]}"/><text x="${q[0]}" y="${q[1]-8}" font-size="10" text-anchor="middle">${fa(p[1][i][1])}</text>`).join('')});
 return `<svg viewBox="0 0 ${W} ${H}" width="100%">${g}</svg><div class="legend">${DATA.pace.map(p=>`<span style="--k:${p[2]}"><i></i>${p[0]}</span>`).join('')}</div>`}},
{id:"sched",title:"برنامهٔ کلاسی هفته",wide:1,render(){
 return `<div class="tblw"><table><tr><th></th><th>زنگ ۱</th><th>زنگ ۲</th><th>زنگ ۳</th><th>زنگ ۴</th></tr>${DATA.schedule.map(r=>`<tr><th>${r[0]}</th>${r[1].map(c=>`<td class="${c?'':'em'}">${c||'خالی'}</td>`).join('')}</tr>`).join('')}</table></div>`}}
];

/* ===== render ===== */
function start(){mkP();const main=document.getElementById('main'),nav=document.getElementById('nav');main.replaceChildren();nav.replaceChildren();
MODULES.forEach(m=>{const s=document.createElement('section');s.id=m.id;if(m.wide)s.className='wide';s.innerHTML=`<h2>${m.title}</h2>${m.render()}`;main.appendChild(s);
 nav.insertAdjacentHTML('beforeend',`<a href="#${m.id}">${m.title.split(' (')[0]}</a>`)});
document.getElementById('today').textContent=jd(TODAY,{weekday:'long',day:'numeric',month:'long',year:'numeric'});
document.getElementById('stamp').textContent='آخرین به‌روزرسانی داده: '+jd(STAMP,{day:'numeric',month:'long'});
const todo=P.filter(r=>r.st==='todo'),nx=DATA.exams.filter(e=>e.st==='upcoming'&&diff(e.d)>=0).sort((a,b)=>a.d<b.d?-1:1)[0];
const hwOpen=DATA.homework.filter(h=>h.st==='todo').length,tdy=P.filter(r=>r.pd===TODAY),tdn=tdy.filter(r=>r.st==='done').length;
document.getElementById('stats').innerHTML=[[nx?(diff(nx.d)===0?'امروز':fa(diff(nx.d))+' روز'):'—',nx?'تا امتحان '+nx.s:'امتحانی نیست'],[fa(hwOpen),'تکلیف باز'],[fa(todo.length),'کار باقی‌مانده در برنامه'],[tdy.length?fa(tdn)+'/'+fa(tdy.length):'—','انجام‌شده‌های امروز']].map(a=>`<div class="stat"><b>${a[0]}</b><span>${a[1]}</span></div>`).join('');
}
async function refreshData({initial=false}={}) {
  const st=document.getElementById('stamp');
  try {
    const r=await fetch(API_URL,{cache:'no-store',headers:{'Accept':'application/json'}});
    if(!r.ok) throw new Error(`API ${r.status}`);
    const next=await r.json();
    if(!next || !Array.isArray(next.plan) || !Array.isArray(next.exams) || !Array.isArray(next.homework)) throw new Error('پاسخ API ساختار مورد انتظار را ندارد');
    DATA=next; STAMP=TODAY; lastLiveDataAt=new Date(); start();
    st.textContent='اتصال زنده به دیتابیس · آخرین دریافت: '+lastLiveDataAt.toLocaleTimeString('fa-IR');
    st.title='به‌روزرسانی خودکار هر ۳۰ ثانیه';
  } catch(e) {
    if(initial) start();
    st.textContent='اتصال دیتابیس برقرار نیست؛ '+(lastLiveDataAt?'آخرین داده زنده: '+lastLiveDataAt.toLocaleTimeString('fa-IR'):'نمایش داده‌های نمونه/ذخیره‌شده');
    st.title='خطا در دریافت داده: '+String(e.message||e);
  }
}
refreshData({initial:true});
setInterval(()=>refreshData(),REFRESH_MS);
</script>
